<text x="24" y="690" font-size="12" fill="#52514e">Every vertex except the top one lies inside the ball whose diameter joins the centre of mass to the next vertex up its arm,</text>
<text x="24" y="708" font-size="12" fill="#52514e">so the body cannot balance on it. Heights alternate in sign near the bottom: the plate is thick there and thin near the top.</text>
